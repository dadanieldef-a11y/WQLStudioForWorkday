<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <title>WQL Studio — Toad for Workday Extend</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
